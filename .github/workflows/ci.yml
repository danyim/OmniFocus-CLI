name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and dev dependencies
        run: pip install -e ".[dev]"

      - name: pip-audit
        run: pip-audit

      - name: Ruff
        run: ruff check src/ tests/

      - name: Black
        run: black --check src/ tests/

      - name: Mypy
        run: mypy src/

      - name: Pytest with 100% coverage gate
        run: pytest --cov=src/omnifocus --cov-fail-under=100 -q

      - name: Generate coverage badge payload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cat > coverage-badge.json <<'EOF'
          {"schemaVersion":1,"label":"coverage","message":"100%","color":"2ea44f"}
          EOF

      - name: Upload coverage badge artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: coverage-badge.json

  build-container:
    name: Build Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          target: runtime
          load: true
          push: false
          tags: omnifocus-cli:ci

      - name: Smoke test CLI help
        run: docker run --rm omnifocus-cli:ci --help

      - name: Smoke test CLI version
        run: docker run --rm omnifocus-cli:ci --version

      - name: Smoke test invalid MCP invocation
        run: |
          set +e
          output="$(docker run --rm omnifocus-cli:ci mcp extra 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F "does not accept additional arguments"

      - name: Smoke test default MCP launcher
        run: |
          set +e
          timeout 3s docker run --rm -i omnifocus-cli:ci >/tmp/of-mcp.out 2>/tmp/of-mcp.err
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            cat /tmp/of-mcp.out
            cat /tmp/of-mcp.err
            exit 1
          fi
