name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and dev dependencies
        run: pip install -e ".[dev]"

      - name: pip-audit
        run: pip-audit

      - name: Ruff
        run: ruff check src/ tests/

      - name: Black
        run: black --check src/ tests/

      - name: Mypy
        run: mypy src/

      - name: Pytest with 100% coverage gate
        run: pytest --cov=src/omnifocus --cov-report=json:coverage.json --cov-fail-under=100 -q

      - name: Generate coverage badge payload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python - <<'PY'
          import json
          from pathlib import Path

          totals = json.loads(Path("coverage.json").read_text(encoding="utf-8"))["totals"]
          percent = float(totals["percent_covered"])
          if percent.is_integer():
              message = f"{int(percent)}%"
          else:
              message = f"{percent:.2f}%"

          if percent >= 100:
              color = "2ea44f"
          elif percent >= 90:
              color = "dfb317"
          else:
              color = "e05d44"

          Path("coverage-badge.json").write_text(
              json.dumps(
                  {
                      "schemaVersion": 1,
                      "label": "coverage",
                      "message": message,
                      "color": color,
                  }
              ),
              encoding="utf-8",
          )
          PY

      - name: Publish coverage badge branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git clone --depth 1 --branch badges \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$tmpdir"
          else
            git clone --depth 1 \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$tmpdir"
            cd "$tmpdir"
            git checkout --orphan badges
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cd "$GITHUB_WORKSPACE"
          fi

          cp coverage-badge.json "$tmpdir/coverage-badge.json"
          touch "$tmpdir/.nojekyll"

          cd "$tmpdir"
          git add coverage-badge.json .nojekyll
          if git diff --cached --quiet; then
            echo "Coverage badge unchanged"
            exit 0
          fi

          git commit -m "chore(ci): update coverage badge for ${GITHUB_SHA}"
          git push origin HEAD:badges

  build-container:
    name: Build Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build runtime image
        run: docker build --file Containerfile --target runtime --tag omnifocus-cli:ci .

      - name: Smoke test CLI help
        run: docker run --rm omnifocus-cli:ci --help

      - name: Smoke test CLI version
        run: docker run --rm omnifocus-cli:ci --version

      - name: Smoke test invalid MCP invocation
        run: |
          set +e
          output="$(docker run --rm omnifocus-cli:ci mcp extra 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F "does not accept additional arguments"

      - name: Smoke test default MCP launcher
        run: |
          set +e
          timeout 3s docker run --rm -i omnifocus-cli:ci >/tmp/of-mcp.out 2>/tmp/of-mcp.err
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            cat /tmp/of-mcp.out
            cat /tmp/of-mcp.err
            exit 1
          fi
